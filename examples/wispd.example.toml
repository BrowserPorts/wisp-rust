# wispd — fully annotated reference configuration
#
# This file enables BOTH transports:
#   * Wisp v2 over WebSocket   ([wisp_websocket])  — port 4242
#   * Wisp v2 over WebTransport ([wisp_wt])        — port 4243 (UDP/HTTP3)
#
# typos cause `wispd` to refuse to start rather than silently ignore.
#
# Run:    wispd --config /etc/wispd/wispd.toml
# Build:  see /AGENTS.md (macOS QUIC needs arch -arm64 + SDKROOT + MACOSX_DEPLOYMENT_TARGET=14.5)

# ============================================================================
# [wisp.server] — core Wisp v2 server semantics, shared by WS and WT
# ============================================================================
[wisp.server]
endpoint            = "/wisp/"        # request path the upgrade must match (normalized; trailing slash optional)
buffer_size         = 256                                                                      
continue_threshold  = 230                                                                       
allow_tcp_streams   = true
allow_udp_streams   = true
stream_limit_per_host = -1            # -1 = unlimited; per-(connection, host:port) concurrent stream cap
stream_limit_total  = 4096            # per-connection concurrent stream cap across all destinations
wisp_version        = "v2"            # "v1" | "v2"; v2 enables extensions, CONTINUE flow control, multi-stream priority

[wisp.auth]
required            = true
token_path          = true
token_file          = "/etc/wispd/tokens.toml"
resolver_timeout_ms = 1000

# ============================================================================
# [wisp.destination] — what the proxy is allowed to dial
# ============================================================================
[wisp.destination]
domain_blacklist    = ["*.internal.example.com"]
# domain_whitelist  = ["*.example.com"]  # omit for no whitelist; a listed set admits only those names
port_whitelist      = [80, 443]       # restrict outbound ports; HTTP + HTTPS only by default
udp_port_whitelist  = [443]           # UDP ports; omit to follow port_whitelist
host_port_whitelist = []
allow_direct_ip                       = false   # reject `1.2.3.4:443` style hosts; require DNS name
allow_private_ips                     = false   # block RFC 1918 / fc00::/7
allow_loopback_ips                    = false   # block 127.0.0.0/8, ::1

# ============================================================================
# [wisp.origin] — CORS-style Origin header gate (enforced on both WS and WT)
# ============================================================================
[wisp.origin]
origin_whitelist     = ["https://app.example.com"]
origin_blacklist     = []
block_blank_origins  = true                                                  

# ============================================================================
# [wisp.client] — peer identification
# ============================================================================
[wisp.client]
client_ip_blacklist  = []
# client_ip_whitelist = ["203.0.113.0/24"]  # omit to admit every client
parse_real_ip        = true                                 # honor X-Forwarded-For / Forwarded
parse_real_ip_from   = ["127.0.0.1", "10.0.0.0/8"]                                     

# ============================================================================
# [wisp.dns] — resolver behavior
# ============================================================================
[wisp.dns]
dns_ttl                                 = 60      # seconds; positive cache TTL cap
dns_negative_ttl                        = 5       # seconds; NXDOMAIN cache TTL
dns_method                              = "resolve"                                                      
dns_servers                             = []      # empty + auto = system resolver; non-empty overrides
dns_result_order                        = "ipv4first" # "ipv4first" | "ipv6first" | "verbatim"
dns_cache_max_entries                   = 4096
max_dns_resolutions_per_ip_per_minute   = 600
max_dns_resolutions_per_minute          = 60000
max_unique_hostnames_per_ip_per_minute  = 120

# ============================================================================
# [wisp.limits] — hard caps and per-IP / per-connection rate limits
# ============================================================================
[wisp.limits]
max_connections                                  = 10000
max_connections_per_ip                           = 32
max_binary_frame_bytes                           = 1048576    # 1 MiB
max_text_frame_bytes                             = 65536
max_host_bytes                                   = 253        # RFC 1035 max DNS name length
max_pending_packets_per_stream                   = 512
max_pending_bytes_per_stream                     = 8388608
max_egress_queue_bytes                           = 33554432
max_ingress_bytes_per_connection                 = 8388608    # 8 MiB of uploads held per connection
max_buffered_bytes_total                         = 134217728  # 128 MiB held by the whole process
max_connection_starts_per_ip_per_minute          = 600
max_connection_starts_per_minute                 = 60000
max_tcp_stream_opens_per_connection_per_minute   = 1200
max_tcp_stream_opens_per_ip_per_minute           = 4800
max_tcp_bytes_per_connection_per_second          = 268435456  # 256 MiB/s
max_tcp_bytes_per_ip_per_second                  = 536870912  # 512 MiB/s
max_datagrams_per_connection_per_second          = 50000
max_datagram_bytes_per_connection_per_second     = 67108864   # 64 MiB/s
max_datagrams_per_ip_per_second                  = 200000
max_datagram_bytes_per_ip_per_second             = 268435456  # 256 MiB/s
datagram_rate_limit_strikes                      = 5
datagram_rate_limit_strike_window_ms             = 60000
max_control_messages_per_connection_per_minute   = 600
max_control_messages_per_ip_per_minute           = 30000
max_binary_packets_per_connection_per_minute     = 600000
max_concurrent_proxy_control_handlers            = 16
proxy_control_ext_payload_max_bytes              = 4096
max_proxy_rules_per_connection                   = 256
max_proxy_control_reply_bytes                    = 65536
max_proxy_rule_field_bytes                       = 512

# ============================================================================
# [wisp.rate_limit] — distributed limiter backend (memory or Redis)
# ============================================================================
[wisp.rate_limit]
backend                                = "memory"    # "memory" (default, per process) | "redis" (shared across processes)
ipv6_prefix                            = 56          # IPv6 bits that count as one client for per-IP limits (16..=64)
# With backend = "redis" all three of the following apply (redis_url is rejected under "memory"):
# redis_url                            = "redis://127.0.0.1:6379/0"
# redis_key_prefix                     = "wispd"
# redis_hash_tag                       = "rate-limit"
proxy_control_upstream_ops_per_second  = 10
proxy_control_upstream_burst           = 20
proxy_control_mutation_ops_per_second  = 2
proxy_control_mutation_burst           = 5

# ============================================================================
# [wisp.timeouts] — all values in milliseconds
# ============================================================================
[wisp.timeouts]
stream_idle_timeout_ms = 600000   # 10 min; per-stream silence
connect_timeout_ms     = 10000    # outbound TCP dial deadline
idle_timeout_ms        = 60000    # whole-connection idle (also drives QUIC IdleTimeoutMs on WT)
handshake_timeout_ms   = 15000    # WS upgrade / WT extended-CONNECT must complete inside this window

# ============================================================================
# [wisp.protocol_inspection] — sniff first N bytes per stream to enforce policy
# ============================================================================
[wisp.protocol_inspection]
enabled                  = true
allowed_protocols        = ["http", "https", "http2", "ws"]
max_bytes                = 8192
timeout_ms               = 250
allow_h2c                = false   # plain HTTP/2 prior knowledge (no TLS)
allow_tls_without_alpn   = true
allow_quic_initial       = false                                                        

[wisp.proxy]
force_proxy = false

# ============================================================================
# ============================================================================
# ============================================================================
[wisp_websocket]
enabled               = true
host                  = "0.0.0.0"
port                  = 4242
bind_addr             = "0.0.0.0:4242" # explicit bind; overrides host/port if set
cert_path             = "/etc/wispd/tls/fullchain.pem"
key_path              = "/etc/wispd/tls/privkey.pem"
endpoint              = "/wisp/"       # override [wisp.server].endpoint for this transport
proxy_control_enabled = false          # true needs a provider below ([wisp_proxy_mullvad] or [wisp_proxy_resi]) enabled
ingress_mode          = "direct_tls"                                                                    

# ============================================================================
# ============================================================================
[wisp_proxy_control]
enabled = false                        # true needs a provider below enabled, and wisp_version = "v2"

# ============================================================================
# [wisp_wt] — Wisp v2 over WebTransport (HTTP/3 + extended CONNECT via msquic)
# ============================================================================
[wisp_wt]
enabled            = true
host               = "0.0.0.0"
port               = 4243              # UDP; client uses https://host:4243/wisp/
endpoint           = "/wisp/"          # the extended-CONNECT :path
cert_path          = "/etc/wispd/tls/fullchain.pem"
key_path           = "/etc/wispd/tls/privkey.pem"
max_datagram_bytes = 1200              # RFC 9221 max; msquic caps to MTU minus overhead
webtransport_proxy_enabled         = false
max_proxy_sessions_per_connection = 4
max_proxy_substreams_per_session   = 64

# ============================================================================
# [wisp_proxy_mullvad] — optional Mullvad WireGuard SOCKS5 backend
# Provider crate lives in browser-ports/wisp-rust-proxy-providers.
# Omit the whole section or set enabled = false to skip registration.
# ============================================================================
[wisp_proxy_mullvad]
enabled           = false
relay_api         = "https://api.mullvad.net/www/relays/wireguard/"
wireproxy_socks5  = "127.0.0.1:40000"

# ============================================================================
# [wisp_proxy_resi] — optional residential / partner HTTP-API proxy backend
# ============================================================================
[wisp_proxy_resi]
enabled       = false
api_base      = "https://example-residential.invalid"
bearer_token  = "REPLACE_ME"
cookie        = ""
country       = "US"
ip_type       = "residential"

# ============================================================================
# [ip_tunnel] — IP packets over Wisp (extension 0xF3, IP_TUNNEL)
# A client with its own network stack sends whole IPv4/IPv6 packets; the
# relay routes them with NAT, like a home router. Linux only: each tunnel
# gets a network namespace (TUN, veth, nftables), which needs CAP_NET_ADMIN
# and CAP_SYS_ADMIN and the `ip` and `nft` programs. wispd refuses to start
# with enabled = true when it cannot build them. Destinations follow the
# [wisp.destination] address and port rules per flow; allow_direct_ip and
# domain lists do not apply (a credential with a domain_whitelist cannot
# open tunnels). force_proxy cannot be combined with tunnels.
# ============================================================================
[ip_tunnel]
enabled                    = false
ipv4_lan                   = "192.168.1.0/24"   # what every tunnel sees
ipv4_gateway               = "192.168.1.1"
ipv4_client                = "192.168.1.100"
# ipv6_prefix              = "2001:db8:42::/48" # a routed prefix the relay owns; omit for IPv4 only
ipv6_tunnel_prefix_len     = 64
transit_prefix             = "10.231.0.0/16"    # per-tunnel veth /30s
netns_prefix               = "wtun"             # namespaces wtun-<id>; stale ones are removed at start
# egress_interface         = "eth0"             # default: masquerade on any non-tunnel interface
link_mtu                   = 1500
max_packet                 = 1500
max_tunnels_per_connection = 1
max_tunnels_total          = 256
resume_grace_s             = 30                 # 0 turns resume off
reject_with                = "icmp"             # icmp | reset | drop
icmp_echo                  = true
dns_servers                = ["1.1.1.1", "8.8.8.8"]
dns_search                 = []
max_flows_per_tunnel       = 4096
max_new_flows_per_tunnel_per_minute = 1200
max_packets_per_tunnel_per_second   = 20000
max_bytes_per_tunnel_per_second     = 26214400
max_packets_per_ip_per_second       = 40000
max_bytes_per_ip_per_second         = 67108864
