[package]
name = "wisp-rust-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.9.0", default-features = false, features = ["async", "napi6", "serde-json"] }
napi-derive = "3.5.6"
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
wisp-config = { path = "../wisp-config" }
wisp-core = { path = "../wisp-core", default-features = false, features = ["ws"] }
wisp-wisp-server = { path = "../wisp-wisp-server" }

[build-dependencies]
napi-build = "2.3.2"
