[wisp.server]
wisp_version = "v2"

[wisp.destination]
port_whitelist    = [80, 443]

# The distributed Redis limiter is not implemented yet; "redis" is rejected at
# startup. Use "memory" (per-instance) until it lands. Behind a load balancer,
# per-IP/global limits are enforced per instance, not shared across the fleet.
[wisp.rate_limit]
backend       = "memory"
redis_fail_open = false

[wisp_websocket]
enabled               = true
host                  = "0.0.0.0"
port                  = 4242
endpoint              = "/wisp/"
proxy_control_enabled = true
plain                 = true

[wisp_proxy_control]
enabled = true

[wisp_proxy_mullvad]
enabled          = false
relay_api        = "https://api.mullvad.net/app/v1/relays"
wireproxy_socks5 = "127.0.0.1:1080"

[wisp_proxy_resi]
enabled      = false
api_base     = ""
bearer_token = ""
country      = "US"
ip_type      = "residential"
