[wisp.server]
wisp_version = "auto"

[wisp.auth]
required            = false
token_path          = true
resolver_timeout_ms = 1000

[wisp.destination]
port_whitelist    = [80, 443]
host_port_whitelist = [{ host = "highschool-game1.g123-puyo.com", port = 13002 }]

[wisp.rate_limit]
backend = "memory"

[wisp_websocket]
enabled               = true
host                  = "0.0.0.0"
port                  = 4242
endpoint              = "/wisp/"
cert_path             = "/etc/wispd/tls/fullchain.pem"
key_path              = "/etc/wispd/tls/privkey.pem"
proxy_control_enabled = true
ingress_mode          = "direct_tls"

[wisp_proxy_control]
enabled = true

[wisp_proxy_mullvad]
enabled          = true
relay_api        = "https://api.mullvad.net/www/relays/wireguard/"
wireproxy_socks5 = "127.0.0.1:40000"

[wisp_proxy_resi]
enabled      = false
api_base     = ""
bearer_token = ""
country      = "US"
ip_type      = "residential"
